<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dashboard ciudadano de orientación hematológica canina." />
    <meta name="theme-color" content="#f4f7f8" />
    <script>
      (() => {
        const saved = localStorage.getItem("hemovet4-theme") || "system";
        const dark = saved === "dark" || (saved === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.dataset.themePreference = saved;
      })();
    </script>
    <title>HemoVet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
