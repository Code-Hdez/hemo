name: CI/CD — HemoVet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: "Manual override. A green push to main already deploys on its own; DEPLOY here re-runs it for an exact SHA. VALIDATE_WIF_IAP never deploys"
        required: true
        type: choice
        default: VALIDATE_WIF_IAP
        options:
          - VALIDATE_WIF_IAP
          - PUBLISH
          - DEPLOY
      confirm_sha:
        description: "Para DEPLOY: SHA completo mostrado por GitHub"
        required: false
        type: string
      chat_server_writes:
        description: "CONDICION DE MEDICION (M.2/M.3). ON = el servidor escribe cifras y estados, y la prosa libre se sanea. Apagado por defecto: cambia lo que el sistema escribe en la historia clinica. Queda registrado en el manifiesto de release, no en un secreto"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hemovet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GCP_PROJECT_ID: project-5b36701c-f44f-4c03-a12
  GCP_PROJECT_NUMBER: "371832959385"
  GCP_REGION: us-central1
  # Las dos VMs dejaron de compartir zona: un evento de capacidad zonal dejo a
  # us-central1-a sin e2/n1/n2d/t2d y hemovet-prod se recreo en us-central1-c
  # desde una machine image, conservando 10.128.0.2 y 136.64.136.49. La GPU
  # sigue en us-central1-a. Una sola GCP_ZONE mandaria un destino a la zona
  # equivocada, asi que cada instancia lleva la suya.
  GCP_PRODUCTION_ZONE: us-central1-c
  GCP_GPU_ZONE: us-central1-a
  GCP_PRODUCTION_INSTANCE: hemovet-prod
  GCP_GPU_INSTANCE: hemovet-llm-gpu-a100
  OLLAMA_PRIVATE_BASE_URL: http://10.128.0.3:11434/
  REGISTRY_HOST: us-central1-docker.pkg.dev
  REGISTRY_REPOSITORY: us-central1-docker.pkg.dev/project-5b36701c-f44f-4c03-a12/hemovet-images
  WIF_PROVIDER: projects/371832959385/locations/global/workloadIdentityPools/hemovet-github/providers/github-main-production
  WIF_SERVICE_ACCOUNT: hemovet-github-cicd@project-5b36701c-f44f-4c03-a12.iam.gserviceaccount.com

jobs:
  scope:
    name: Resolve revision scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run_tests: ${{ steps.scope.outputs.run_tests }}
      publish_release: ${{ steps.scope.outputs.publish_release }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # 0 = full history. This job diffs BEFORE_SHA..GITHUB_SHA for an
          # arbitrary push, which can span more than one commit (e.g. two
          # commits pushed together) - a shallow fetch-depth: 2 assumed
          # exactly one new commit and broke with "fatal: bad object" the
          # moment that assumption didn't hold.
          fetch-depth: 0

      - name: Resolve operation without changing infrastructure
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          OPERATION: ${{ inputs.operation }}
          CONFIRM_SHA: ${{ inputs.confirm_sha }}
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_tests=false
          publish_release=false

          case "$EVENT_NAME" in
            pull_request)
              run_tests=true
              ;;
            push)
              run_tests=true
              changed_files="$(mktemp)"
              trap 'rm -f "$changed_files"' EXIT
              if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
                publish_release=true
              else
                git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" >"$changed_files"
                if grep -Evq '^(docs/|.*\.md$)' "$changed_files"; then
                  publish_release=true
                fi
              fi
              ;;
            workflow_dispatch)
              case "$OPERATION" in
                VALIDATE_WIF_IAP) ;;
                PUBLISH|DEPLOY)
                  run_tests=true
                  publish_release=true
                  # Avoid re-running the exact same test/frontend/configuration
                  # jobs that a push-triggered run already passed for this
                  # identical commit: reuse that result instead of re-testing
                  # from zero. Any lookup failure (API hiccup, no prior run,
                  # still in progress) safely falls back to run_tests=true.
                  if gh run list --repo "$GITHUB_REPOSITORY" \
                       --workflow deploy.yml --branch main --event push \
                       --status success --json headSha --limit 20 \
                       | jq -e --arg sha "$GITHUB_SHA" \
                         'any(.[]; .headSha == $sha)' >/dev/null 2>&1
                  then
                    run_tests=false
                    printf 'tests_reused=push run already green for %s\n' \
                      "$GITHUB_SHA" >>"$GITHUB_STEP_SUMMARY"
                  fi
                  ;;
                *)
                  echo "ERROR: unsupported workflow operation"
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "ERROR: unsupported event"
              exit 1
              ;;
          esac

          if [[ "$OPERATION" == "DEPLOY" ]]; then
            test "$GITHUB_REF" = "refs/heads/main"
            test "$CONFIRM_SHA" = "$GITHUB_SHA"
          fi
          printf 'run_tests=%s\n' "$run_tests" >>"$GITHUB_OUTPUT"
          printf 'publish_release=%s\n' "$publish_release" >>"$GITHUB_OUTPUT"
          printf 'revision=%s tests=%s publish=%s\n' \
            "$GITHUB_SHA" "$run_tests" "$publish_release" >>"$GITHUB_STEP_SUMMARY"

  test:
    name: Backend tests
    needs: scope
    if: needs.scope.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: hemovet_test
          POSTGRES_USER: hemovet
          POSTGRES_PASSWORD: hemovet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://hemovet:hemovet_test@localhost:5432/hemovet_test
      SECRET_KEY: ci-test-secret-key-0123456789abcdef
      HEMOVET_ENABLE_LOCAL_ML: "0"
      HEMOVET_ENABLE_LOCAL_EXTRACTION: "1"
      GEMINI_API_KEY: ""
      OLLAMA_BASE_URL: ""
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements.ml.txt
            backend/requirements.local-extraction.txt
      - name: Install dependencies
        run: |
          pip install --quiet -r backend/requirements.txt
          pip install --quiet -r backend/requirements-dev.txt
          pip install --quiet -r backend/requirements.ml.txt
          pip install --quiet -r backend/requirements.local-extraction.txt
      - name: Static checks
        run: python -m ruff check --no-cache backend
      - name: Apply and verify migrations
        working-directory: backend
        run: |
          alembic upgrade head
          python -m pytest tests/test_migrations.py -q
      - name: Verify LLM and release contracts without Ollama
        working-directory: backend
        run: |
          python -m pytest tests/llm_chat -q
          python -m pytest \
            tests/test_release_manifest_contract.py \
            tests/test_artifact_registry_contract.py \
            tests/test_gpu_runtime_bootstrap.py \
            tests/test_stage8_release_pipeline.py -q
      - name: Verify evaluation tooling
        run: python -m pytest tools/llm_cbc_eval/tests -q
      - name: Backend regression without duplicated suites
        working-directory: backend
        run: |
          python -m pytest tests -q \
            --ignore=tests/test_migrations.py \
            --ignore=tests/llm_chat \
            --ignore=tests/test_release_manifest_contract.py \
            --ignore=tests/test_artifact_registry_contract.py \
            --ignore=tests/test_gpu_runtime_bootstrap.py \
            --ignore=tests/test_stage8_release_pipeline.py
      - name: Validate curated RAG corpus
        working-directory: backend
        run: |
          RAG_SOURCE_DIR=knowledge_base/expert_review/approved \
          RAG_COLLECTION_NAME=hemovet_canine_hematology_v2 \
          RAG_SCHEMA_VERSION=hemovet-rag-v2 \
          RAG_SOURCE_MANIFEST=knowledge_base/manifests/sources_manifest.json \
          RAG_ALLOW_TEST_DOCUMENTS=0 \
          RAG_ALLOW_AI_PROVISIONAL=0 \
          python scripts/ingest_rag.py index --dry-run >/dev/null

  frontend:
    name: Frontend tests
    needs: scope
    if: needs.scope.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --user 1001
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend_4/package-lock.json
      - name: Install dependencies
        working-directory: frontend_4
        run: npm ci
      - name: Unit, static and production build
        working-directory: frontend_4
        run: |
          npm test -- --run
          npm run check
          npm run build
      - name: Critical browser contracts
        working-directory: frontend_4
        run: |
          npm run test:e2e -- --project=desktop-1440 \
            -g "asistente|un 401|atención veterinaria"

  configuration:
    name: Deployment configuration
    needs: scope
    if: needs.scope.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate the three supported Compose topologies
        run: python backend/scripts/validate_compose_topology.py
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 \
            caddy validate --config /etc/caddy/Caddyfile
      - name: Validate scripts without executing a deployment
        run: |
          for script in deploy/ci/*.sh deploy/prod/*.sh deploy/gpu/*.sh; do
            bash -n "$script"
          done

  wif_reject_missing_environment:
    name: WIF rejects missing environment
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'VALIDATE_WIF_IAP'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Attempt authentication without production environment
        id: denied_auth
        continue-on-error: true
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: false
          export_environment_variables: false
          request_reason: hemovet-stage8-negative-${{ github.run_id }}
      - name: Require fail-closed rejection
        if: always()
        env:
          AUTH_OUTCOME: ${{ steps.denied_auth.outcome }}
        run: |
          set -Eeuo pipefail
          test "$AUTH_OUTCOME" = "failure"
          echo "PASS: WIF rejected a job without environment=production."

  wif_iap_validation:
    name: WIF and IAP validation
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'VALIDATE_WIF_IAP'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Authenticate with WIF, without a service account key
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          request_reason: hemovet-stage8-iap-${{ github.run_id }}
      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          version: ">= 536.0.0"
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Verify IAP without modifying production
        run: |
          set -Eeuo pipefail
          test "$(gcloud compute instances describe "$GCP_GPU_INSTANCE" \
            --zone="$GCP_GPU_ZONE" --format='value(status)')" = "TERMINATED"
          test "$(gcloud compute snapshots describe \
            hemovet-llm-gpu-pre-stage6-20260802 --format='value(status)')" = "READY"
          deploy/prod/validate-iap-access.sh

  build_and_push:
    name: Build and publish immutable release
    needs: [scope, test, frontend, configuration]
    if: >-
      always() &&
      needs.scope.outputs.publish_release == 'true' &&
      contains(fromJSON('["success", "skipped"]'), needs.test.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.frontend.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.configuration.result)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install release tooling dependencies
        run: pip install --quiet -r backend/requirements.txt
      - name: Authenticate with WIF
        id: google_auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false
          export_environment_variables: false
          request_reason: hemovet-stage8-build-${{ github.run_id }}
      - name: Build once, publish and bind real digests
        id: release
        env:
          ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          PRODUCTION_ENV_B64: ${{ secrets.PRODUCTION_ENV_B64 }}
        run: |
          set -Eeuo pipefail
          test -n "$ACCESS_TOKEN"
          test -n "$PRODUCTION_ENV_B64"
          release_dir="$RUNNER_TEMP/hemovet-release"
          base_env="$RUNNER_TEMP/hemovet-base.env"
          candidate_env="$RUNNER_TEMP/hemovet-candidate.env"
          docker_config="$RUNNER_TEMP/hemovet-docker-config"
          builder="hemovet-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 0700 "$release_dir" "$docker_config"
          cleanup() {
            docker logout "$REGISTRY_HOST" >/dev/null 2>&1 || true
            docker buildx rm "$builder" >/dev/null 2>&1 || true
            rm -f -- "$base_env" "$candidate_env"
            if [[ -d "$docker_config" ]]; then
              rm -r -- "$docker_config"
            fi
          }
          trap cleanup EXIT

          printf '%s' "$ACCESS_TOKEN" | DOCKER_CONFIG="$docker_config" \
            docker login --username oauth2accesstoken --password-stdin \
            "$REGISTRY_HOST" >/dev/null
          export DOCKER_CONFIG="$docker_config"
          docker buildx create --name "$builder" --driver docker-container --use \
            >/dev/null
          docker buildx inspect --bootstrap >/dev/null
          export BUILD_CREATED="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          deploy/ci/build-and-publish-images.sh "$release_dir"

          APP_ENV=test \
          DATABASE_URL='sqlite+pysqlite:///:memory:' \
          SECRET_KEY='ci-release-preparation-key-0123456789' \
          HEMOVET_PROJECT_ROOT="$GITHUB_WORKSPACE" \
          RAG_SOURCE_DIR=knowledge_base/expert_review/approved \
          RAG_COLLECTION_NAME=hemovet_canine_hematology_v2 \
          RAG_SCHEMA_VERSION=hemovet-rag-v2 \
          RAG_SOURCE_MANIFEST=knowledge_base/manifests/sources_manifest.json \
          RAG_ALLOW_TEST_DOCUMENTS=0 \
          RAG_ALLOW_AI_PROVISIONAL=0 \
          PYTHONPATH=backend python backend/scripts/ingest_rag.py \
            index --dry-run >"$release_dir/rag-summary.json"

          umask 077
          printf '%s' "$PRODUCTION_ENV_B64" | base64 --decode >"$base_env"
          # Condicion de MEDICION. `store_true`, asi que solo viaja si se pidio;
          # un despliegue normal la deja apagada sin tener que decir nada.
          chat_server_writes_flag=()
          if [[ "${{ inputs.chat_server_writes }}" == "true" ]]; then
            chat_server_writes_flag=(--chat-server-writes)
          fi
          PYTHONPATH=backend python backend/scripts/prepare_release.py \
            "${chat_server_writes_flag[@]}" \
            --base-environment "$base_env" \
            --artifact-set "$release_dir/artifact-set.json" \
            --rag-summary "$release_dir/rag-summary.json" \
            --caddy-configuration deploy/Caddyfile \
            --bundle-manifest deploy/gpu/bundle-manifest.sha256 \
            --github-sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --created-at "$BUILD_CREATED" \
            --ollama-base-url "$OLLAMA_PRIVATE_BASE_URL" \
            --candidate-environment "$candidate_env" \
            --release-manifest "$release_dir/release-manifest.json"
          PYTHONPATH=backend python backend/scripts/project_gpu_release.py \
            --release-manifest "$release_dir/release-manifest.json" \
            --bundle-manifest deploy/gpu/bundle-manifest.sha256 \
            --output "$release_dir/gpu-runtime.json"
          PYTHONPATH=backend python backend/scripts/validate_release_payload.py \
            --release-manifest "$release_dir/release-manifest.json" \
            --environment "$candidate_env" \
            --source-root "$GITHUB_WORKSPACE"

          artifact_name="hemovet-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'artifact_name=%s\n' "$artifact_name" >>"$GITHUB_OUTPUT"
          printf 'release=%s artifact=%s\n' "$GITHUB_SHA" "$artifact_name" \
            >>"$GITHUB_STEP_SUMMARY"
      - name: Retain release evidence for deployment and rollback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/hemovet-release/artifact-set.json
            ${{ runner.temp }}/hemovet-release/release-manifest.json
            ${{ runner.temp }}/hemovet-release/gpu-runtime.json
            ${{ runner.temp }}/hemovet-release/rag-summary.json
          if-no-files-found: error
          retention-days: 30

  publish_gpu_release:
    name: Publish deferred GPU release
    needs: build_and_push
    if: >-
      always() &&
      needs.build_and_push.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.operation == 'DEPLOY' &&
          inputs.confirm_sha == github.sha
        )
      )
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build_and_push.outputs.artifact_name }}
          path: ${{ runner.temp }}/hemovet-release
      - name: Authenticate with WIF
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          request_reason: hemovet-stage8-gpu-release-${{ github.run_id }}
      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          version: ">= 536.0.0"
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Update desired metadata without starting or restarting the GPU
        run: |
          set -Eeuo pipefail
          release_dir="$RUNNER_TEMP/hemovet-release"
          previous_release="$RUNNER_TEMP/previous-gpu-release.json"
          gcloud compute instances describe "$GCP_GPU_INSTANCE" \
            --zone="$GCP_GPU_ZONE" --format=json \
            | jq -er '[.metadata.items[] | select(.key=="hemovet-gpu-desired-release") | .value] | first' \
            >"$previous_release"
          jq -e . "$previous_release" >/dev/null
          gcloud compute instances add-metadata "$GCP_GPU_INSTANCE" \
            --zone="$GCP_GPU_ZONE" \
            --metadata-from-file="hemovet-gpu-previous-release=$previous_release,hemovet-gpu-desired-release=$release_dir/gpu-runtime.json"
          status="$(gcloud compute instances describe "$GCP_GPU_INSTANCE" \
            --zone="$GCP_GPU_ZONE" --format='value(status)')"
          printf 'gpu_release=pending_boot_validation vm_status=%s\n' "$status"

  deploy_prod:
    name: Deploy production through IAP
    needs: [scope, build_and_push, publish_gpu_release]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.build_and_push.result == 'success' &&
      needs.publish_gpu_release.result == 'success' &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.operation == 'DEPLOY' &&
          inputs.confirm_sha == github.sha
        )
      )
    runs-on: ubuntu-latest
    # Deploys serialize instead of racing: two commits pushed close together
    # would otherwise ship concurrently through the same IAP tunnel and the
    # older one could land last. Queued, never cancelled — a deploy already
    # touching production always finishes.
    concurrency:
      group: hemovet-production-deploy
      cancel-in-progress: false
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install release tooling dependencies
        run: pip install --quiet -r backend/requirements.txt
      - name: Download release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build_and_push.outputs.artifact_name }}
          path: ${{ runner.temp }}/hemovet-release
      - name: Authenticate with WIF
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          request_reason: hemovet-stage8-deploy-${{ github.run_id }}
      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          version: ">= 536.0.0"
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Render the same private environment and transfer through IAP
        env:
          PRODUCTION_ENV_B64: ${{ secrets.PRODUCTION_ENV_B64 }}
        run: |
          set -Eeuo pipefail
          test -n "$PRODUCTION_ENV_B64"
          release_dir="$RUNNER_TEMP/hemovet-release"
          base_env="$RUNNER_TEMP/hemovet-base.env"
          candidate_env="$RUNNER_TEMP/hemovet-candidate.env"
          source_archive="$RUNNER_TEMP/hemovet-source.tgz"
          remote_dir="/tmp/hemovet-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            rm -f "$base_env" "$candidate_env" "$source_archive"
            gcloud compute ssh "$GCP_PRODUCTION_INSTANCE" \
              --zone="$GCP_PRODUCTION_ZONE" --tunnel-through-iap --quiet \
              --command="if [ -d '$remote_dir' ]; then rm -r -- '$remote_dir'; fi" \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          umask 077
          printf '%s' "$PRODUCTION_ENV_B64" | base64 --decode >"$base_env"
          PYTHONPATH=backend python backend/scripts/render_release_environment.py \
            --base-environment "$base_env" \
            --release-manifest "$release_dir/release-manifest.json" \
            --ollama-base-url "$OLLAMA_PRIVATE_BASE_URL" \
            --output "$candidate_env"
          git archive --format=tar.gz --output="$source_archive" "$GITHUB_SHA"

          gcloud compute ssh "$GCP_PRODUCTION_INSTANCE" \
            --zone="$GCP_PRODUCTION_ZONE" --tunnel-through-iap --quiet \
            --command="install -d -m 0700 '$remote_dir'"
          gcloud compute scp --zone="$GCP_PRODUCTION_ZONE" --tunnel-through-iap --quiet \
            "$source_archive" \
            "$release_dir/release-manifest.json" \
            "$candidate_env" \
            deploy/prod/deploy-release.sh \
            "$GCP_PRODUCTION_INSTANCE:$remote_dir/"
          gcloud compute ssh "$GCP_PRODUCTION_INSTANCE" \
            --zone="$GCP_PRODUCTION_ZONE" --tunnel-through-iap --quiet \
            --command="sudo '$remote_dir/deploy-release.sh' --archive '$remote_dir/hemovet-source.tgz' --release-manifest '$remote_dir/release-manifest.json' --candidate-environment '$remote_dir/hemovet-candidate.env'"

  production_smoke_tests:
    name: Production smoke tests
    needs: deploy_prod
    if: always() && needs.deploy_prod.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify public core and degradable chat
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --max-time 20 \
            https://hemovet.app/ --output /dev/null
          # The public core and the RAG index must be up the moment the
          # deploy reports success: neither depends on the GPU.
          curl --fail --silent --show-error --max-time 20 \
            https://hemovet.app/api/v1/chat/health \
            | jq -e '.rag_ready == true' >/dev/null
          # The provider is a different matter. A freshly recreated backend
          # warms the model up, and loading the 27B on the L4 takes 77-126 s
          # measured; until /api/ps proves it resident the backend reports
          # status "fail" on purpose (app/core/availability.py: "degraded"
          # means the chat answers and RAG is down, never that the LLM is
          # cold). Checking once right after the deploy therefore failed
          # every run that had to warm up. Poll instead, and only fail if the
          # model never becomes resident.
          deadline=$((SECONDS + 300))
          until status="$(curl --fail --silent --show-error --max-time 20 \
                          https://hemovet.app/api/v1/chat/health \
                          | jq -er '.status')"; [ "$status" = "ok" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              printf 'chat never became ready; last status=%s\n' "$status" >&2
              curl --silent --max-time 20 \
                https://hemovet.app/api/v1/chat/health | jq -e '.codes' >&2
              exit 1
            fi
            sleep 15
          done
