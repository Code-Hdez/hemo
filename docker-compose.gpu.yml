# =============================================================================
# HemoVet — Runtime GPU autónomo
# =============================================================================
# Este archivo NO se combina con docker-compose.yml ni docker-compose.prod.yml.
# Solo contiene Ollama y la preparación idempotente del modelo. Requiere driver
# NVIDIA y NVIDIA Container Toolkit ya instalados; no aprovisiona la VM.
#
# Validación sin arrancar servicios:
#   docker compose --env-file deploy/gpu/compose.env.example \
#     -f docker-compose.gpu.yml config
# =============================================================================

name: hemovet-gpu

services:
  ollama:
    image: "${HEMOVET_OLLAMA_RUNTIME_IMAGE:?set-canonical-ollama-runtime-image-by-digest}"
    pull_policy: never
    restart: unless-stopped
    init: true
    runtime: nvidia
    labels:
      com.hemovet.component: "llm-runtime"
      com.hemovet.release: "${HEMOVET_GPU_RELEASE_ID:?set-authorized-gpu-release-id}"
      com.hemovet.runtime-digest: "${HEMOVET_GPU_RUNTIME_DIGEST:?set-authorized-runtime-digest}"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-30m}"
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-4096}"
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
      OLLAMA_MAX_LOADED_MODELS: "${OLLAMA_MAX_LOADED_MODELS:-1}"
      OLLAMA_MAX_QUEUE: "${OLLAMA_MAX_QUEUE:-32}"
      OLLAMA_FLASH_ATTENTION: "${OLLAMA_FLASH_ATTENTION:-1}"
      OLLAMA_KV_CACHE_TYPE: "${OLLAMA_KV_CACHE_TYPE:-q8_0}"
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: "${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}"
    ports:
      - target: 11434
        published: "11434"
        host_ip: "${OLLAMA_BIND_ADDRESS:?set-verified-private-GPU-address}"
        protocol: tcp
    volumes:
      - ollama-models:/root/.ollama
    command: ["serve"]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 14G
        reservations:
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  ollama_setup:
    image: "${HEMOVET_OLLAMA_RUNTIME_IMAGE:?set-canonical-ollama-runtime-image-by-digest}"
    pull_policy: never
    restart: "no"
    labels:
      com.hemovet.component: "llm-model-bootstrap"
      com.hemovet.release: "${HEMOVET_GPU_RELEASE_ID:?set-authorized-gpu-release-id}"
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}"
      OLLAMA_EXPECTED_MODEL_DIGEST: "${OLLAMA_EXPECTED_MODEL_DIGEST:?set-approved-model-digest}"
      OLLAMA_EXPECTED_QUANTIZATION: "${OLLAMA_EXPECTED_QUANTIZATION:?set-approved-quantization}"
      OLLAMA_AUTO_PULL: "${OLLAMA_AUTO_PULL:-1}"
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$${OLLAMA_AUTO_PULL}" != "1" ]; then
          echo "Skipping Ollama model bootstrap because OLLAMA_AUTO_PULL=$${OLLAMA_AUTO_PULL}"
          exit 0
        fi
        ollama show "$${OLLAMA_MODEL}" >/dev/null 2>&1 || ollama pull "$${OLLAMA_MODEL}"
        ollama show "$${OLLAMA_MODEL}" >/dev/null
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ollama-models:
    name: hemovet_gpu_ollama_models
