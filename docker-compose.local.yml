# =============================================================================
# HemoVet — Overlay de desarrollo local con Ollama
# =============================================================================
# Este es el único perfil de la aplicación que añade un runtime LLM local.
# No publica 11434 en el host: backend consume Ollama por la red de Compose.
#
# Uso:
#   cp .env.example .env
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
# =============================================================================

services:
  ollama:
    image: ollama/ollama:0.32.6@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    restart: unless-stopped
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-30m}"
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-4096}"
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
      OLLAMA_MAX_LOADED_MODELS: "${OLLAMA_MAX_LOADED_MODELS:-1}"
      OLLAMA_MAX_QUEUE: "${OLLAMA_MAX_QUEUE:-16}"
      OLLAMA_FLASH_ATTENTION: "${OLLAMA_FLASH_ATTENTION:-0}"
      OLLAMA_KV_CACHE_TYPE: "${OLLAMA_KV_CACHE_TYPE:-f16}"
    volumes:
      - ollama-data:/root/.ollama
    command: ["serve"]
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  ollama_setup:
    image: ollama/ollama:0.32.6@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    restart: "no"
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}"
      OLLAMA_EXPECTED_MODEL_DIGEST: "${OLLAMA_EXPECTED_MODEL_DIGEST:-}"
      OLLAMA_EXPECTED_QUANTIZATION: "${OLLAMA_EXPECTED_QUANTIZATION:-}"
      OLLAMA_AUTO_PULL: "${OLLAMA_AUTO_PULL:-0}"
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$${OLLAMA_AUTO_PULL}" != "1" ]; then
          echo "Skipping Ollama model bootstrap because OLLAMA_AUTO_PULL=$${OLLAMA_AUTO_PULL}"
          exit 0
        fi
        ollama show "$${OLLAMA_MODEL}" >/dev/null 2>&1 || ollama pull "$${OLLAMA_MODEL}"
        ollama show "$${OLLAMA_MODEL}" >/dev/null

  backend:
    environment:
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama:11434/}"
    depends_on:
      ollama_setup:
        condition: service_completed_successfully

volumes:
  # Conserva la clave histórica para reutilizar el volumen local existente.
  ollama-data:
